name: matrix refresh

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      plugins:
        description: 'Optional comma-separated packages or paths; overrides the target list.'
        required: false
        default: ''
      out:
        description: 'Where to write cells.'
        required: false
        default: 'matrix/cells'
      tools:
        description: 'Capture the tool inventory and prompt cost too.'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Probe
        env:
          PLUGINS: ${{ inputs.plugins }}
          OUT: ${{ inputs.out || 'matrix/cells' }}
          TOOLS: ${{ inputs.tools == false && '--no-tools' || '--tools' }}
        run: |
          set -euo pipefail
          if [ -n "$PLUGINS" ]; then
            node scripts/matrix/run.mjs --plugins "$PLUGINS" --out "$OUT" --concurrency 4 "$TOOLS"
          else
            node scripts/matrix/run.mjs --targets matrix/targets-top50.json --out "$OUT" --concurrency 4 "$TOOLS"
          fi

      - name: Regenerate the site and the aggregate index
        if: ${{ inputs.out == '' || inputs.out == 'matrix/cells' }}
        run: node scripts/matrix/site.mjs

      - name: Snapshot the aggregate into the panel package
        if: ${{ inputs.out == '' || inputs.out == 'matrix/cells' }}
        run: node scripts/matrix/bundle-panel-data.mjs

      - name: Upload the candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: matrix-candidate
          path: |
            ${{ inputs.out || 'matrix/cells' }}
            matrix/index
            panel/data/aggregate.json
          if-no-files-found: error
