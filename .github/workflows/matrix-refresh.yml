name: matrix refresh

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      plugins:
        description: 'Optional comma-separated packages or paths; overrides the target list.'
        required: false
        default: ''
      out:
        description: 'Where to write cells.'
        required: false
        default: 'matrix/cells'
      tools:
        description: 'Capture the tool inventory and prompt cost too.'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Probe
        env:
          PLUGINS: ${{ inputs.plugins }}
          OUT: ${{ inputs.out || 'matrix/cells' }}
          TOOLS: ${{ inputs.tools == false && '--no-tools' || '--tools' }}
        run: |
          set -euo pipefail
          if [ -n "$PLUGINS" ]; then
            node scripts/matrix/run.mjs --plugins "$PLUGINS" --target-mode refresh-latest --out "$OUT" --concurrency 4 "$TOOLS"
          else
            node scripts/matrix/run.mjs --targets matrix/targets-top50.json --target-mode refresh-latest --out "$OUT" --concurrency 4 "$TOOLS"
          fi
          node scripts/matrix/conflicts.mjs --cells "$OUT" --cache .matrix-cache --out matrix/index/conflicts.json

      - name: Upload the candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: matrix-candidate
          path: |
            ${{ inputs.out || 'matrix/cells' }}
            matrix/index/conflicts.json
          if-no-files-found: error

  publish:
    needs: probe
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: matrix-candidate
          path: candidate

      - name: Verify the candidate offline
        run: node scripts/matrix/verify-public.mjs --source candidate

      - name: Sync the verified public artifact
        run: node bin/dsh-plugin-matrix.mjs sync --source candidate --out matrix/public

      - name: Open a data-only pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          checked=$(node -e "const fs=require('fs'); process.stdout.write(String(JSON.parse(fs.readFileSync('candidate/manifest.json','utf8')).cellCount))")
          if [ "$checked" = "0" ]; then
            echo "no cells to publish"
            exit 0
          fi
          if [ -z "$(git status --porcelain)" ]; then
            echo "no data change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="matrix/refresh-${{ github.run_id }}"
          git checkout -b "$branch"
          git add matrix/public
          git commit -m "chore(matrix): refresh public evidence"
          git push origin "HEAD:$branch"
          gh pr create --title "chore(matrix): refresh public evidence" --body "Automated matrix candidate, revalidated offline. Review composition and trust changes; do not merge automatically." --base "${{ github.event.repository.default_branch }}" --head "$branch"
