name: publish-lint

# Publishes the linter only when a NEW version reaches main. A push that does
# not change the version is a no-op: a release is an intentional version bump in
# a reviewed change, not a side effect of merging. The gate runs the unit tests,
# the official zero-false-positive baseline and a packed-tarball smoke test
# before npm sees anything.
on:
  push:
    branches: [main]
    # A release is a version bump, not a side effect of merging code. Only a
    # package.json change can publish; src-only merges run ci.yml instead.
    paths:
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-lint
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Decide whether this version is new
        id: release
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          current=$(node -p "require('./package.json').version")
          if npm view "$name@$current" version >/dev/null 2>&1; then
            echo "$name@$current is already on npm; bump package.json in a reviewed change to release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$name@$current is new; it must pass the gates before publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests
        run: npm test

      - name: Probe version must match the package version
        if: steps.release.outputs.publish == 'true'
        run: |
          node --input-type=module -e "
            import { PROBE_VERSION } from './src/shared/version.js';
            import { readFileSync } from 'node:fs';
            const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
            if (PROBE_VERSION !== version) {
              console.error('PROBE_VERSION ' + PROBE_VERSION + ' does not match package.json ' + version);
              console.error('Cells produced by this build would claim a probe version they are not.');
              process.exit(1);
            }
          "

      - name: Fetch the official packages
        if: steps.release.outputs.publish == 'true'
        run: node scripts/fetch-official-from-npm.mjs --limit 80

      - name: Zero-false-positive baseline
        if: steps.release.outputs.publish == 'true'
        run: node scripts/e2e-official.mjs --expect 80

      - name: Packed-tarball smoke test
        if: steps.release.outputs.publish == 'true'
        run: |
          set -euo pipefail
          npm pack --silent
          mkdir -p /tmp/pack-smoke && cd /tmp/pack-smoke
          npm init -y >/dev/null 2>&1
          npm install --silent "$GITHUB_WORKSPACE"/*.tgz
          ./node_modules/.bin/dsh-plugin-lint "$GITHUB_WORKSPACE/panel" --quiet --no-color

      - name: Check the registry token
        if: steps.release.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN is not set. Add an npm Automation token as a repository secret."
            exit 1
          fi
          npm whoami

      - name: Publish
        if: steps.release.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance