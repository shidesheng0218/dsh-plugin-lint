name: publish-lint

# Publishes the linter whenever its package changes on main. Same shape as
# publish-panel: bump a patch when the version is already on npm, commit the
# bump back under a subject prefix this job skips, publish with provenance.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'bin/**'
      - 'scripts/lib/**'
      - 'scripts/probe-boot.mjs'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-lint
  cancel-in-progress: false

jobs:
  publish:
    if: "!startsWith(github.event.head_commit.message, 'chore(lint): publish')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Unit tests
        run: npm test

      # Fail before the version bump, not after it: a missing or placeholder
      # token must not leave an unpublished bump commit on main.
      - name: Check the registry token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN is not set. Add an npm Automation token as a repository secret."
            exit 1
          fi
          npm whoami

      - name: Bump the version when it is already published
        id: version
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          current=$(node -p "require('./package.json').version")
          if npm view "$name@$current" version >/dev/null 2>&1; then
            echo "$name@$current is already on npm; bumping a patch"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            npm version patch --no-git-tag-version
            bumped=$(node -p "require('./package.json').version")
            git add package.json
            git commit -m "chore(lint): publish $name@$bumped"
            git push
            echo "version=$bumped" >> "$GITHUB_OUTPUT"
          else
            echo "$name@$current is new; publishing it"
            echo "version=$current" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance
