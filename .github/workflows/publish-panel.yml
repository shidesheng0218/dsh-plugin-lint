name: publish-panel

# Publishes the panel whenever its package changes on main.
#
# The matrix snapshot is baked into the panel package, so a data refresh is a
# panel release. The job bumps the patch version when the current one is already
# on npm, commits the bump back to main with a marker that stops this workflow
# from re-triggering, and publishes with provenance.
on:
  push:
    branches: [main]
    paths:
      - 'panel/**'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-panel
  cancel-in-progress: false

jobs:
  publish:
    if: "!contains(github.event.head_commit.message, '[skip publish]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Unit tests
        run: npm test

      - name: Bump the panel version when it is already published
        id: version
        working-directory: panel
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          current=$(node -p "require('./package.json').version")
          if npm view "$name@$current" version >/dev/null 2>&1; then
            echo "$name@$current is already on npm; bumping a patch"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            npm version patch --no-git-tag-version
            bumped=$(node -p "require('./package.json').version")
            git add package.json
            git commit -m "chore(panel): publish $name@$bumped [skip publish]"
            git push
            echo "version=$bumped" >> "$GITHUB_OUTPUT"
          else
            echo "$name@$current is new; publishing it"
            echo "version=$current" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        working-directory: panel
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
