name: publish-panel

# Publishes the panel only when a NEW version reaches main. A push that does not
# change panel/package.json is a no-op, so a data or code change does not ship a
# package by itself. The gate packs the panel, installs the tarball into a
# temporary prefix and imports the entry, which catches boundary regressions
# that unit tests cannot see.
on:
  push:
    branches: [main]
    # Only a panel version bump publishes; code-only panel merges run ci.yml.
    paths:
      - 'panel/package.json'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-panel
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Decide whether this panel version is new
        id: release
        working-directory: panel
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          current=$(node -p "require('./package.json').version")
          if npm view "$name@$current" version >/dev/null 2>&1; then
            echo "$name@$current is already on npm; bump panel/package.json in a reviewed change to release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$name@$current is new; it must pass the gates before publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests
        run: npm test

      - name: Packed-panel import smoke test
        if: steps.release.outputs.publish == 'true'
        run: |
          set -euo pipefail
          cd panel
          npm pack --silent
          mkdir -p /tmp/panel-smoke && cd /tmp/panel-smoke
          npm init -y >/dev/null 2>&1
          npm install --silent "$GITHUB_WORKSPACE"/panel/*.tgz
          node --input-type=module -e "
            const pkg = await import('@shidesheng0218/dsh-plugin-lint-panel');
            if (typeof pkg.apply !== 'function') {
              console.error('the packed panel entry does not export apply()');
              process.exit(1);
            }
          "

      - name: Check the registry token
        if: steps.release.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN is not set. Add an npm Automation token as a repository secret."
            exit 1
          fi
          npm whoami

      - name: Publish
        if: steps.release.outputs.publish == 'true'
        working-directory: panel
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public