name: verify self-reported cells

on:
  schedule:
    - cron: '0 4 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Re-run a sample of self-reported cells
        run: node scripts/matrix/verify.mjs --sample 0.2 --seed ${{ github.run_number }} --concurrency 2

      - name: Upload the verification candidate
        uses: actions/upload-artifact@v4
        with:
          name: verification-candidate
          path: matrix/index/verification.json
          if-no-files-found: error
