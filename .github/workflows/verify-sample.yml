name: verify self-reported cells

on:
  schedule:
    - cron: '0 4 * * 3'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Re-run a sample of self-reported cells
        run: node scripts/matrix/verify.mjs --sample 0.2 --seed ${{ github.run_number }} --concurrency 2

      - name: Open a pull request with the verification result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing to verify this week"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="matrix/verify-${{ github.run_id }}"
          git checkout -b "$branch"
          git add -A
          git commit -m "chore(matrix): verification sample"
          git push origin "HEAD:$branch"
          gh pr create --title "chore(matrix): verification sample" --body "Sample re-verification of self-reported cells. A disputed cell keeps both verdicts in its file; the disagreement is published rather than hidden." --base "${{ github.event.repository.default_branch }}" --head "$branch"
