name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Unit tests
        run: npm test

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Coverage gate (lines 85 / branches 80 / functions 80)
        run: npm run test:coverage

  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch the official packages
        run: node scripts/fetch-official-from-npm.mjs --limit 80

      - name: Zero-false-positive baseline
        run: node scripts/e2e-official.mjs --expect 80

      - name: Lint our own plugin and fixtures
        run: node bin/dsh-plugin-lint.mjs panel test/probe-plugins --no-color --exit-code

      - name: Packed-artifact smoke (all bins, both entry points, panel import)
        run: node scripts/package-smoke.mjs

  probe-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Runs the real Docker backend against a controlled fixture. The first
      # run installs the harness inside the container (several minutes); the
      # shared cache then makes the remaining cells cheap.
      - name: Isolated Docker probe
        run: |
          set -uo pipefail
          # The cache must live on an exec-capable filesystem: native addons
          # mmap from it, and some runner /tmp mounts are noexec.
          CACHE="$RUNNER_TEMP/dsh-probe-cache"
          set +e
          node scripts/probe-boot.mjs test/probe-plugins/tool-alpha --dsh 0.2.0-rc.2 --cache "$CACHE" > /tmp/probe.log 2>&1
          status=$?
          set -e
          cat /tmp/probe.log
          findmnt -no TARGET,OPTIONS "$CACHE" 2>/dev/null || true
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          grep -q '"status": "active"' /tmp/probe.log