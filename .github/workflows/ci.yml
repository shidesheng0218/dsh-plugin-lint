name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unit tests
        run: npm test

      - name: Fetch official packages from npm
        run: node scripts/fetch-official-from-npm.mjs --limit 80

      - name: Zero-false-positive baseline
        run: node scripts/e2e-official.mjs

      - name: Lint our own plugin and fixtures
        run: node bin/dsh-plugin-lint.mjs panel test/probe-plugins --no-color --exit-code

      - name: Package smoke test
        run: |
          npm pack --silent
          mkdir -p /tmp/pack-smoke && cd /tmp/pack-smoke
          npm init -y >/dev/null 2>&1
          npm install --silent "$GITHUB_WORKSPACE"/*.tgz
          ./node_modules/.bin/dsh-plugin-lint "$GITHUB_WORKSPACE/panel" --quiet --no-color
